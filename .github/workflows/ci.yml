name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege: every job only reads the repo. Nothing here writes to
# the repo, comments on PRs, or pushes packages.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + test + drift checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # mise is the single source of truth for the Go toolchain and for
      # sqlc/goose/golangci-lint versions, so CI and local runs cannot
      # drift apart.
      - uses: jdx/mise-action@v4

      - name: go build
        run: go build ./...

      # Runs golangci-lint (which bundles govet, staticcheck, and the
      # gofumpt/goimports format-drift check), actionlint over these
      # workflow files, the race-enabled test suite, a check that the
      # committed sqlc output still matches the schema and queries, a
      # go.mod/go.sum drift check, and a DIFMSYNC_* config-drift check.
      # One gate, so a contributor running it locally sees exactly what
      # CI sees — including, now, a mistake in this file.
      - name: just check
        run: just check

  # The behavioural gate over the built image lives in its own reusable
  # workflow, because release.yml has to run the identical one. Duplicated,
  # the copy that matters — the one guarding `latest` — is the copy that
  # silently falls behind.
  container:
    uses: ./.github/workflows/container-tests.yml

  publish:
    name: publish the moving tags
    needs: [check, container]
    # Publishing is main-only. A pull_request build must never move a tag
    # a deployment pulls, and a fork PR could not authenticate to GHCR
    # anyway. `needs` is the other half of that: nothing reaches GHCR
    # until the Go gate and the container gate have both passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Overrides the workflow-level block rather than adding to it, so
    # `contents: read` has to be restated. `packages: write` is scoped to
    # this job alone — no other job here has reason to hold it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      # Versioned releases are tagged by release.yml on a v* tag; this
      # publishes the moving tags only. `edge` tracks main, `sha-<short>`
      # is immutable and is what a deployment pins between releases.
      # `latest` is deliberately NOT set here — it belongs to the newest
      # release, so that pulling it gets a version someone tagged on
      # purpose rather than whatever merged an hour ago.
      #
      # This rebuilds for both architectures from the gha cache the
      # container job populated, so the amd64 image published is the one
      # those smoke tests exercised. buildx cannot --load a multi-arch
      # result, which is why the test build and this are separate.
      - name: publish to ghcr.io
        env:
          # Passed through the environment rather than interpolated into
          # the script body, so nothing from the event context is ever
          # parsed as shell.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # GHCR rejects uppercase in a path. This owner/repo is already
          # lowercase; a rename to one that is not would need `tr A-Z a-z`
          # here rather than a silent 403 on push.
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --cache-from type=gha \
            --build-arg "VERSION=sha-${GITHUB_SHA::7}" \
            -t "$IMAGE:edge" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" .

          echo "published $IMAGE:sha-${GITHUB_SHA::7} (amd64, arm64)"
