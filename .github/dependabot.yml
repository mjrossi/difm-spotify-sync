# Go modules and Actions both pin versions deliberately (see mise.toml's
# comment on reproducibility), which means nothing updates unless
# something proposes it.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
