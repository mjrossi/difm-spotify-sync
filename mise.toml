# Pin the language runtime and project tooling. Contributors install mise
# (https://mise.jdx.dev), then `mise install` at the repo root provisions
# everything below.
#
# Three layers configure this project, and the split is the whole reason
# there is no confusion about which file to edit:
#
#   mise.toml [env]  a CHECKOUT's environment. Committed, non-secret.
#   .env.local       CREDENTIALS. Gitignored, loaded by this file AND by
#                    compose.yaml, so there is exactly one copy of them.
#   Dockerfile ENV   the IMAGE's environment. The container reads neither
#                    file above; `docker run` needs no checkout.
#
# mise.local.toml is the fourth, optional: gitignored, for machine-specific
# non-secret overrides. It is NOT a place for credentials — those go in
# .env.local, or the container half of the split silently gets nothing.
#
# There are no MISE_ENV overlays. See CLAUDE.md for why they were removed.

[tools]
# Patch-pinned so reproducibility > convenience.
go = "1.26.5"

# Project tooling, pinned for the same reason.
"aqua:sqlc-dev/sqlc" = "1.28.0"
"aqua:pressly/goose" = "3.24.0"
"aqua:casey/just" = "1.51.0"
# The justfile's inspection recipes and docs/deploy.md shell out to
# sqlite3; without it here, `mise install` leaves them failing with
# "command not found".
sqlite = "3.53.4"
# golangci-lint v2 is the single lint + format gate for Go (govet +
# staticcheck + gofumpt + goimports all bundled). Config lives in
# .golangci.yml.
"aqua:golangci/golangci-lint" = "2.12.2"
# Workflow YAML is the one thing `just check` could not see, and a broken
# workflow fails in a way that produces no logs — Actions rejects the file
# rather than the step, so there is nothing to read. Deleting a MISE_ENV
# entry once left an `env:` key with only a comment under it and did
# exactly that.
"aqua:rhysd/actionlint" = "1.7.7"

[env]
# A variable belongs here only if it earns one of two jobs. Restating a
# value the binary already defaults to earns neither, and creates a second
# copy with nothing keeping it honest — DIFMSYNC_INTERVAL and
# DIFMSYNC_NETWORK both did exactly that. TestMiseEnvEarnsItsPlace
# enforces this, the same way the Dockerfile's ENV block is enforced.
#
# 1. A development preference: a value deliberately different from the
#    binary's own default, because a checkout is a dev environment and the
#    image is not.
DIFMSYNC_LOG_FORMAT = "text"
DIFMSYNC_LOG_LEVEL = "debug"

# 2. Something a NON-Go tool needs. goose and sqlite3 cannot read a Go
#    flag default, so `just db`, `just ledger` and `just migrate-status`
#    can only find the same database difmsync uses if it is exported.
#    That it matches the flag default is the point, not a duplicate of it.
DIFMSYNC_DB_PATH = "./tmp/difmsync.db"

# The five secrets. compose.yaml reads this same file as its only env_file,
# so the host toolchain and the container share one copy; see
# .env.local.example for what belongs in it. Keep it to credentials — a
# non-secret parked here is invisible to anyone reading [env] above.
#
# Deliberately last: entries in this block are applied in document order,
# so a value here beats the defaults above — which is the same precedence
# Compose gives the file, and keeping the two in agreement is the point.
#
# A missing .env.local is not an error, so a fresh clone and CI (which
# have no secrets) still run every `just` recipe that does not need them.
_.file = ".env.local"
