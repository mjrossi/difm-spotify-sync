# Pin the language runtime and project tooling. Contributors install mise
# (https://mise.jdx.dev), then `mise install` at the repo root provisions
# everything below.
#
# Machine-specific non-secret overrides go in mise.local.toml, which is
# uncommitted. There are no per-environment overlays: MISE_ENV files for
# development and ci existed but changed nothing either could observe —
# every run recipe passed --log-format=text explicitly, and CI runs only
# `just check`, which reads no DIFMSYNC_* at all.
#
# Credentials are NOT here. They live in .env.local, which this file loads
# below and which compose.yaml also reads — one secrets file for both the
# host toolchain and the container. Copy .env.local.example to start.

[tools]
# Patch-pinned so reproducibility > convenience.
go = "1.26.5"

# Project tooling, pinned for the same reason.
"aqua:sqlc-dev/sqlc" = "1.28.0"
"aqua:pressly/goose" = "3.24.0"
"aqua:casey/just" = "1.51.0"
# The justfile's inspection recipes and docs/deploy.md shell out to
# sqlite3; without it here, `mise install` leaves them failing with
# "command not found".
sqlite = "3.53.4"
# golangci-lint v2 is the single lint + format gate (govet + staticcheck +
# gofumpt + goimports all bundled). Config lives in .golangci.yml.
"aqua:golangci/golangci-lint" = "2.12.2"

[env]
# Defaults for a checkout, which is a development environment by
# definition — hence text logs rather than the image's json. The
# container carries its own defaults in the Dockerfile's ENV block and
# does not read this file.
DIFMSYNC_LOG_FORMAT = "text"
DIFMSYNC_LOG_LEVEL = "debug"
DIFMSYNC_INTERVAL = "15m"
DIFMSYNC_DB_PATH = "./tmp/difmsync.db"
# Read by --network; DI.fm is the default, but the same API backs
# RadioTunes, JazzRadio, RockRadio, ClassicalRadio and ZenRadio.
DIFMSYNC_NETWORK = "di"

# The five secrets, shared with the container so there is exactly one copy
# of them. compose.yaml reads the same file as its `.env.local` layer; see
# .env.local.example for what belongs in it.
#
# Deliberately last: entries in this block are applied in document order,
# so a value here beats the defaults above — which is the same precedence
# Compose gives the file, and keeping the two in agreement is the point.
#
# A missing .env.local is not an error, so a fresh clone and CI (which
# have no secrets) still run every `just` recipe that does not need them.
_.file = ".env.local"
