# Compose file for running difm-spotify-sync from a checkout of this
# repo — it builds the image locally. If you just want to run the
# service, you do not need this file or a checkout at all; copy the
# compose snippet from the README, which pulls the published image.
#
# Configuration is environment variables. Every non-secret default is
# baked into the image (see the ENV block in the Dockerfile), so the only
# thing that has to come from outside is the five credentials, and those
# live in .env.local — gitignored, and the same file mise loads for the
# host tooling, so `just sync` and the container read one copy.
#
#   cp .env.local.example .env.local   # then fill it in
#   chmod 600 .env.local
#   docker compose up -d
#   docker compose logs -f connector   # -> the consent URL, once
#
# While there is no refresh token the daemon serves the Spotify consent
# flow and logs a URL carrying a nonce. Open it, approve, and syncing
# starts on the next tick. If you cannot reach that port from a browser,
# `docker compose exec -it connector /app/difmsync auth --manual` needs no
# networking at all. See docs/deploy.md.
services:
  connector:
    build: .
    image: difm-spotify-sync:dev
    restart: unless-stopped
    env_file:
      # Secrets only. Everything else is an image default or an override
      # in the environment block below — keeping this file to credentials
      # is what makes it safe to say "this is the only file to protect".
      - .env.local
    environment:
      # Ownership of the config directory. Set these to the uid/gid that
      # owns whatever you mount at /config; `id -u` and `id -g` on the
      # host. They matter most for a bind mount, which arrives with the
      # ownership the host directory already has.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - difmsync-data:/config
    ports:
      # The one-time consent flow, published to loopback only and
      # deliberately so: it writes a refresh token, which is exactly what
      # the status endpoints below are forbidden from doing. Reach it
      # through an SSH tunnel or whatever terminates TLS in front — or
      # skip it entirely with `auth --manual`.
      #
      # Inert once consent is stored: the listener shuts down for the life
      # of the process and this mapping just reserves the port.
      - "127.0.0.1:3437:3437"
      # The read-only status endpoints, published to the LAN so a
      # dashboard can poll them. Narrow to one interface (e.g.
      # "192.168.1.10:3436:3436") if you would rather not answer on all.
      - "3436:3436"
    # Drops privileges before touching the database — see
    # docker/healthcheck.sh for why that is not optional. `--check`
    # rather than plain `status`: `status` only fails when the account
    # row is missing, so a sync broken for a week still reported healthy.
    #
    # start_period is long because the check fails until the one-time
    # consent has happened, and that needs a human with a browser. A
    # short period would report `unhealthy` for the whole window between
    # first deploy and consent — inverting the signal on precisely the
    # day someone is watching it.
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30m
    # The default is 10s, which SIGKILLs a pass that is mid-flight. The
    # engine survives that — the sync_runs row is closed through a
    # detached context, and the watermark only moves after a clean pass —
    # but a clean stop beats a survivable one.
    stop_grace_period: 45s
    # JSON logs to stdout with no cap is a reliable way to fill a homelab
    # disk and take the sync down with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  difmsync-data:
